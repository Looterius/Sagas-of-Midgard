name: Temporary filtered card drag QA
on:
  push:
    branches: [fix/canon-relations-filter-drag-20261119]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Run desktop and touch drag regression
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/som-drag.log 2>&1 &
          sleep 1
          node <<'JS'
          const {chromium}=require("playwright-core");
          const assert=require("node:assert/strict");
          (async()=>{
            const browser=await chromium.launch({executablePath:"/usr/bin/google-chrome",
              args:["--no-sandbox","--disable-dev-shm-usage"]});
            const pc=await browser.newContext({viewport:{width:1420,height:930}});
            const page=await pc.newPage();page.setDefaultTimeout(12000);
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            await page.goto("http://127.0.0.1:8765/",{waitUntil:"load"});
            const ruler=page.locator('[data-character-primary="rulers"]');
            await ruler.click();
            const card=page.locator('.person-card[data-id="alrek"]');
            let before=await card.evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));
            const rect=await card.boundingBox();assert.ok(rect?.width>15);
            await page.mouse.move(rect.x+rect.width/2,rect.y+rect.height/2);
            await page.mouse.down();
            await page.mouse.move(rect.x+rect.width/2+125,rect.y+rect.height/2+42,{steps:9});
            await page.mouse.up();
            const after=await card.evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));
            assert.ok(after.x>before.x+80,"Rulers photo drag failed "+JSON.stringify({before,after}));
            assert.ok(await page.locator("#reset-positions").isVisible(),"Moved filtered layout must be resettable");
            console.log("PASS drag Alrek's portrait in Władcy i jarlowie");
            await page.locator('[data-character-primary="heroes"]').click();
            await ruler.click();
            const again=await card.evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));
            assert.ok(Math.abs(again.x-after.x)<1,"Filtered positions lost across tab switches");
            await ruler.click(); // same filter selected should not reset
            const still=await card.evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));
            assert.ok(Math.abs(still.x-after.x)<1,"Reclick of selected filter erased custom drag");
            await page.locator("#reset-positions").click();
            const reset=await card.evaluate(el=>({x:parseFloat(el.style.left),y:parseFloat(el.style.top)}));
            assert.ok(Math.abs(reset.x-before.x)<1,"Reset did not restore default group positions");
            console.log("PASS filtered layout survives switching and resets on demand");
            await page.locator('[data-character-primary="captives"]').click();
            assert.equal(await page.locator(".person-card:visible").count(),2);
            await page.locator('.person-card[data-id="ragnvald-s"]').evaluate(el=>el.click());
            assert.ok((await page.locator("#inspector-name").innerText()).includes("Skjoldsson"));
            assert.ok((await page.locator("#inspector-description").innerText()).includes("pojmany"));
            console.log("PASS Jeńcy contains Ragnvald Skjoldsson");
            assert.deepEqual(errors,[],"JS runtime errors desktop");
            await pc.close();
            const ctx=await browser.newContext({viewport:{width:390,height:780},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const m=await ctx.newPage();m.setDefaultTimeout(12000);
            m.on("pageerror",e=>errors.push(e.message));
            await m.goto("http://127.0.0.1:8765/",{waitUntil:"load"});
            await m.locator('[data-character-primary="rulers"]').click();
            const target=m.locator('.person-card[data-id="alrek"]');
            const box=await target.boundingBox();
            assert.ok(box?.width>20,"King card not rendered on mobile "+JSON.stringify(box));
            const x=Math.round(box.x+box.width/2), y=Math.round(box.y+box.height/2);
            const start=await target.evaluate(el=>parseFloat(el.style.left));
            await m.evaluate(()=>{
              window.__debugTouch=[];
              for(const selector of ['.person-card[data-id="alrek"]','#map-viewport','#map-scene']){
                const el=document.querySelector(selector);
                for(const name of ['pointerdown','pointermove','pointerup','gotpointercapture','lostpointercapture','touchstart','touchmove']){
                  el.addEventListener(name,e=>{
                    window.__debugTouch.push({
                      selector,name,pointerType:e.pointerType,isPrimary:e.isPrimary,
                      button:e.button,target:e.target?.className,
                      x:e.clientX,y:e.clientY
                    });
                  },{capture:true});
                }
              }
            });
            const cdp=await ctx.newCDPSession(m);
            await cdp.send("Input.dispatchTouchEvent",{type:"touchStart",touchPoints:[{x,y}]});
            await m.waitForTimeout(560);
            await cdp.send("Input.dispatchTouchEvent",{type:"touchMove",touchPoints:[{x:x+44,y:y+14}]});
            await m.waitForTimeout(100);
            await cdp.send("Input.dispatchTouchEvent",{type:"touchEnd",touchPoints:[]});
            await m.waitForTimeout(100);
            const moved=await target.evaluate(el=>parseFloat(el.style.left));
            console.log("TOUCH_DEBUG",JSON.stringify(await m.evaluate(()=>({eventLog:window.__debugTouch,cardClass:document.querySelector('.person-card[data-id="alrek"]').className}))));
            assert.ok(moved>start+15,"Mobile long-press must drag king card "+JSON.stringify({start,moved}));
            assert.ok(await m.locator("#inspector").isHidden(),"Long press must not open biography");
            console.log("PASS long-press-drag on mobile Władcy i jarlowie");
            const current=await target.boundingBox();
            await m.touchscreen.tap(Math.round(current.x+current.width/2),Math.round(current.y+current.height/2));
            assert.ok(await m.locator("#inspector").isVisible(),"Short tap must open biography");
            console.log("PASS short tap on same king opens biography");
            assert.deepEqual(errors,[],"JS errors");
            await browser.close();
            console.log("PASS desktop and mobile filtered card drag");
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
