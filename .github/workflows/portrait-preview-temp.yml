name: Temporary portrait contact sheet
on:
  push:
    branches: [feat/asgrim-hero-portraits-20261118]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build small image contact sheet from public portrait files
        run: |
          python -m pip install pillow -q
          python - <<'PY'
          import base64,io
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          folder=Path('assets/portraits')
          images=[
            'Asgrim.jpeg',
            '819106917_1403096258558492_2259915694493588498_n.jpg',
            '836508976_2515877412221096_575784062671443810_n.jpg',
            '836713553_1631673708686109_4202120061548436723_n.png',
            '841056920_1454607076732851_414940541375700284_n.jpg',
            '843041093_29439569015649515_6290487889105704541_n.jpg',
            'ChatGPT Image 17 wrz 2026, 11_37_54.png',
          ]
          tw,th=200,260
          canvas=Image.new('RGB',(tw*4,th*2),'#ddd9d0')
          draw=ImageDraw.Draw(canvas)
          for i,name in enumerate(images):
            p=folder/name
            img=Image.open(p).convert('RGB')
            img.thumbnail((188,220))
            x=(i%4)*tw+(tw-img.width)//2
            y=(i//4)*th+6
            canvas.paste(img,(x,y))
            draw.text(((i%4)*tw+7,(i//4)*th+230),str(i+1)+': '+name[:21],fill='#171717')
          buffer=io.BytesIO();canvas.save(buffer,'JPEG',quality=62,optimize=True)
          encoded=base64.b64encode(buffer.getvalue()).decode()
          for i in range(0,len(encoded),3000):
            print(f'SHEET_PART_{i//3000:03d}='+encoded[i:i+3000])
          PY
