name: Temporary portrait browser performance QA
on:
  push:
    branches: [perf/optimized-portraits-20261118]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Verify network and portrait resolution on mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/qa-portrait-site.log 2>&1 &
          sleep 1
          node <<'JS'
          const {chromium}=require("playwright-core");
          const assert=require("node:assert/strict");
          (async()=>{
            const browser=await chromium.launch({executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
            const context=await browser.newContext({viewport:{width:360,height:780},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const page=await context.newPage();
            const errors=[],loaded=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("response",r=>{
              const u=new URL(r.url());
              if(u.pathname.includes("/assets/portraits/"))loaded.push({
                url:u.pathname,status:r.status(),length:Number(r.headers()["content-length"]||0)
              });
            });
            await page.goto("http://127.0.0.1:8765/",{waitUntil:"load"});
            assert.ok(await page.evaluate(()=>Boolean(window.SOM_PORTRAITS)),"Manifest did not load");
            await page.locator(".person-card[data-id='sianita'] img").waitFor({state:"attached"});
            await page.waitForFunction(()=>{
              const el=document.querySelector(".person-card[data-id='sianita'] img");
              return el?.getAttribute("src")?.includes("optimized/sianita-thumb.webp");
            },null,{timeout:12000});
            const firstSrc=await page.locator(".person-card[data-id='sianita'] img").getAttribute("src");
            assert.ok(firstSrc.includes("sianita-thumb.webp"));
            await page.waitForTimeout(800);
            assert.ok(!loaded.some(x=>x.url.includes("-full.webp")),"Full images were loaded before opening detail");
            console.log("PASS network uses optimized thumb, no full images on overview",firstSrc);
            await page.locator(".person-card[data-id='sianita']").evaluate(el=>el.click());
            assert.ok(await page.locator("#inspector").isVisible());
            const detailSrc=await page.locator("#inspector img.asset-photo").getAttribute("src");
            assert.ok(detailSrc.includes("sianita-full.webp"),"Modal did not request optimized full image");
            await page.locator("#inspector img.asset-photo").evaluate(el=>el.decode());
            console.log("PASS detail loads sharper WebP only on opening",detailSrc);
            await page.locator("#close-inspector").click();
            await page.evaluate(()=>window.SOM_ATLAS.open("hrafnvik"));
            await page.locator("#atlas2-dialog-people .atlas2-image").first().waitFor();
            const atlasSrc=await page.locator("#atlas2-dialog-people .atlas2-image").first().getAttribute("src");
            assert.ok(atlasSrc.includes("optimized/")&&atlasSrc.includes("-thumb.webp"),"Atlas NPC still loaded original image");
            console.log("PASS Atlas shows WebP thumbnails",atlasSrc);
            const sources=await page.evaluate(()=>({
              missing:window.SOM_PORTRAITS["assets/portraits/svala-ketilsdottir-i-synowie.jpg"].missing,
              imgs:[...document.querySelectorAll(".person-card img")].length
            }));
            assert.equal(sources.missing,true);
            assert.ok(sources.imgs>=16,"Not enough portrait placeholders");
            assert.deepEqual(errors,[],"Browser runtime exception");
            const bad=loaded.filter(x=>x.status>=400);
            assert.deepEqual(bad,[],"Failed portrait image request");
            const total=loaded.reduce((sum,x)=>sum+x.length,0);
            console.log("NETWORK_RESULT",JSON.stringify({
              imageRequests:loaded.length,totalTransferKB:Math.round(total/1024),
              optimizedCount:loaded.filter(x=>x.url.includes("/optimized/")).length,
              originalCount:loaded.filter(x=>!x.url.includes("/optimized/")).length
            }));
            console.log("PASS mobile portrait performance and absence of missing-file requests");
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
