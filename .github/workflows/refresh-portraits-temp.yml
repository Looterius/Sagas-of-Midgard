name: Temporary refresh and audit portrait assets
on:
  push:
    branches: [fix/free-character-layout-portraits-rulers-20261118]
permissions:
  contents: write
jobs:
  portraits:
    if: ${{ !contains(github.event.head_commit.message, 'prebuilt optimized WebP') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate WebP images and inspect unlabeled source artwork
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          node scripts/export-public-portrait-references.mjs > /tmp/som-portrait-refs.json
          python scripts/optimize-portraits.py /tmp/som-portrait-refs.json
          python <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          import io,base64,zipfile
          root=Path('assets/portraits')
          z=root/'Sagas-of-Midgard-Portrety-do-GitHuba.zip'
          sample=['Bound Beneath the Norse Winter Sky.png','ChatGPT Image 17 wrz 2026, 11_37_54.png','Orm.png']
          with zipfile.ZipFile(z) as archive:
            print('ZIP_CONTENTS',archive.namelist())
            members=[m for m in archive.namelist() if m.lower().endswith(('.jpg','.jpeg','.png','.webp'))]
            if members:
              sample.append(('zip',members[0]))
          sheet=Image.new('RGB',(640,640),'#e8e3d9')
          for index,item in enumerate(sample[:4]):
            x=(index%2)*320;y=(index//2)*320
            if isinstance(item,tuple):
              with zipfile.ZipFile(z) as archive:
                original=Image.open(io.BytesIO(archive.read(item[1])))
                title='ZIP: '+Path(item[1]).name
                img=original.copy()
            else:
              original=Image.open(root/item);img=original.copy();title=item
            img.thumbnail((300,270))
            sheet.paste(img,(x+10+(300-img.width)//2,y+8+(270-img.height)//2))
            ImageDraw.Draw(sheet).text((x+10,y+282),title[:37],fill='#000000')
          blob=io.BytesIO();sheet.save(blob,'JPEG',quality=68)
          raw=base64.b64encode(blob.getvalue()).decode()
          for index in range(0,len(raw),3000):
            print('UNASSIGNED_PREVIEW_PART_'+str(index//3000).zfill(3)+'='+raw[index:index+3000])
          PY
      - name: Commit generated optimized WebP portrait variants
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portraits/optimized portrait-assets.js
          if ! git diff --cached --quiet; then
            git commit -m 'perf: prebuilt optimized WebP for new characters and kings'
            git push origin HEAD:fix/free-character-layout-portraits-rulers-20261118
          fi
