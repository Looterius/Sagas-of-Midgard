name: Public site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check portrait-assets.js
          node --check navigation.js
          node --check atlas.js
          node --check graph-geometry.js
          node --check app.js
          node --check character-groups.js
          node --check maps.js
      - name: Check public Atlas
        run: node scripts/check-public-atlas.mjs
      - name: Check public Maps
        run: node scripts/check-public-maps.mjs
      - name: Check public Character Groups
        run: node scripts/check-character-groups.mjs
      - name: Check character graph geometry
        run: node scripts/check-character-graph.mjs
      - name: Check mobile interface and relations
        run: node scripts/check-mobile-rwd.mjs
      - name: Check optimized portrait assets and lazy loading
        run: node scripts/check-portrait-assets.mjs
      - name: Check mobile Back navigation and history
        run: node scripts/check-navigation-history.mjs
      - name: Check public catalog and shareable deep links
        run: node scripts/check-public-deep-links.mjs
      - name: Check readable Chronicle chapters and event navigation
        run: node scripts/check-chronicle-reader.mjs
