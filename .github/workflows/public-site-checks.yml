name: Public site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check atlas.js
          node --check app.js
          node --check maps.js
      - name: Check public Atlas
        run: node scripts/check-public-atlas.mjs
      - name: Check public Maps
        run: node scripts/check-public-maps.mjs
