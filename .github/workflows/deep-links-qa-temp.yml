name: Temporary deep-link, fullscreen and catalog browser QA
on:
  push:
    branches: [feat/deep-links-fullscreen-catalog-20261119]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Check desktop and mobile browser behavior
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/som-deep-links.log 2>&1 &
          sleep 1
          node <<'JS'
          const {chromium}=require("playwright-core"),assert=require("node:assert/strict");
          (async()=>{
            const browser=await chromium.launch({executablePath:"/usr/bin/google-chrome",
              args:["--no-sandbox","--disable-dev-shm-usage"]});
            const ctx=await browser.newContext({viewport:{width:1440,height:950}});
            const page=await ctx.newPage();page.setDefaultTimeout(12000);
            const errors=[],missing=[];
            page.on("pageerror",e=>errors.push(e.message));
            page.on("response",r=>{if(r.url().includes("/assets/")&&r.status()>=400)missing.push(r.url());});
            const base="http://127.0.0.1:8765/";
            await page.goto(base,{waitUntil:"load"});
            assert.equal(await page.locator(".nav-btn").count(),6);
            assert.equal(await page.locator(".header-right .chapter").count(),0);
            await page.locator('[data-character-primary="rulers"]').click();
            await page.waitForFunction(()=>new URL(location.href).searchParams.get("grupa")==="rulers");
            assert.equal(await page.locator(".person-card:visible").count(),9);
            await page.evaluate(()=>Object.defineProperty(navigator,"clipboard",{configurable:true,
              value:{writeText:async value=>{window.__copiedURL=value;}}}));
            await page.locator("#share-current-view").click();
            const shared=await page.evaluate(()=>window.__copiedURL);
            assert.ok(shared?.includes("grupa=rulers"),"Copy control did not capture rulers link: "+shared);
            const receiver=await ctx.newPage();receiver.setDefaultTimeout(12000);
            receiver.on("pageerror",e=>errors.push(e.message));
            await receiver.goto(shared,{waitUntil:"load"});
            assert.equal(await receiver.locator(".person-card:visible").count(),9);
            assert.equal(await receiver.locator('[data-character-primary="rulers"]').getAttribute("aria-pressed"),"true");
            console.log("PASS Copy link -> fresh tab reopens Władcy i jarlowie, 9 visible");
            await receiver.locator('[data-character-primary="heroes"]').click();
            await receiver.waitForFunction(()=>new URL(location.href).searchParams.get("grupa")==="heroes");
            await receiver.evaluate(()=>history.back());
            await receiver.waitForFunction(()=>new URL(location.href).searchParams.get("grupa")==="rulers");
            assert.equal(await receiver.locator(".person-card:visible").count(),9);
            console.log("PASS Browser Back restores shared rulers filter");
            await receiver.goto(base+"?view=relationships&dimension=families&value=rod-halfdana",{waitUntil:"load"});
            assert.equal(await receiver.locator(".person-card:visible").count(),2);
            assert.equal(await receiver.locator('.person-card[data-id="halfdan"]:visible').count(),1);
            assert.equal(await receiver.locator('.person-card[data-id="asgrim"]:visible').count(),1);
            console.log("PASS Halfdan-Asgrim family deep link");
            await receiver.goto(base+"?view=relationships&grupa=captives",{waitUntil:"load"});
            assert.equal(await receiver.locator(".person-card:visible").count(),2);
            const ragn=receiver.locator('.person-card[data-id="ragnvald-s"]');
            assert.equal(await ragn.locator(".person-role-badge").innerText(),"JENIEC");
            await ragn.evaluate(el=>el.click());
            assert.ok((await receiver.locator("#inspector-type").innerText()).includes("JENIEC"));
            console.log("PASS Ragnvald Skjoldsson labeled captive in card and biography");
            await receiver.goto(base+"?view=bestiary&entry=troll-w-klatce",{waitUntil:"load"});
            assert.equal(await receiver.locator(".lore-entry").count(),1);
            assert.ok(await receiver.locator(".lore-entry").first().evaluate(el=>el.open));
            assert.ok((await receiver.locator(".lore-entry-detail").innerText()).includes("żelaznej klatce"));
            console.log("PASS direct Bestiariusz troll entry");
            await receiver.goto(base+"?view=items&entry=gungnir",{waitUntil:"load"});
            assert.equal(await receiver.locator(".lore-entry").count(),1);
            assert.ok(await receiver.locator(".lore-entry").first().evaluate(el=>el.open));
            assert.ok((await receiver.locator(".lore-entry-detail").innerText()).includes("Hrafnviku"));
            console.log("PASS direct Gungnir artifact entry");
            await receiver.goto(base+"?view=relationships&grupa=rulers",{waitUntil:"load"});
            await receiver.locator("#fullscreen-toggle").click();
            await receiver.waitForFunction(()=>document.fullscreenElement?.id==="relationships-view" ||
              document.querySelector("#relationships-view")?.classList.contains("is-fullscreen-fallback"));
            assert.equal(await receiver.locator("#fullscreen-toggle").getAttribute("aria-pressed"),"true");
            const bounds=await receiver.locator("#relationships-view").boundingBox();
            assert.ok(bounds?.height>=900&&bounds?.width>=1400,"Fullscreen did not fill viewport "+JSON.stringify(bounds));
            await receiver.locator("#fullscreen-toggle").click();
            await receiver.waitForFunction(()=>document.fullscreenElement?.id!=="relationships-view"&&
              !document.querySelector("#relationships-view")?.classList.contains("is-fullscreen-fallback"));
            console.log("PASS real fullscreen toggles entire graph and exits");
            await ctx.close();
            const mobile=await browser.newContext({viewport:{width:390,height:844},
              isMobile:true,hasTouch:true,deviceScaleFactor:2});
            const mp=await mobile.newPage();mp.setDefaultTimeout(12000);
            mp.on("pageerror",e=>errors.push(e.message));
            await mp.goto(base,{waitUntil:"load"});
            assert.equal(await mp.locator(".nav-btn").count(),6);
            const dims=await mp.evaluate(()=>({viewport:innerWidth,document:document.documentElement.scrollWidth}));
            assert.ok(dims.document<=dims.viewport+3,"Mobile horizontal overflow "+JSON.stringify(dims));
            for(const v of ["bestiary","items"]){
              const tab=mp.locator('.nav-btn[data-view="'+v+'"]');
              const b=await tab.boundingBox();
              assert.ok(b?.x>=0&&b.x+b.width<=390,"Tab not accessible "+v+" "+JSON.stringify(b));
              await tab.click();
              assert.ok(await mp.locator("#"+v+"-view").isVisible());
            }
            console.log("PASS six accessible mobile tabs and both catalog sections");
            assert.deepEqual(errors,[],"Browser exceptions");
            assert.deepEqual(missing,[],"Broken site assets");
            console.log("PASS no missing assets or runtime errors");
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
