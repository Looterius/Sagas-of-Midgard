name: Temporary Vestmar portrait optimization
on:
  push:
    branches: [feat/vestmar-brothers-mord-orm-20261119]
permissions:
  contents: write
jobs:
  portraits:
    if: ${{ !contains(github.event.head_commit.message, 'prebuilt 32 portrait WebP variants') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Rebuild public portrait WebP variants from uploaded images
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          node scripts/export-public-portrait-references.mjs > /tmp/som-portrait-refs.json
          python scripts/optimize-portraits.py /tmp/som-portrait-refs.json
      - name: Commit verified portrait assets
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/portraits/optimized portrait-assets.js
          if ! git diff --cached --quiet; then
            git commit -m 'perf: prebuilt 32 portrait WebP variants'
            git push origin HEAD:feat/vestmar-brothers-mord-orm-20261119
          fi
