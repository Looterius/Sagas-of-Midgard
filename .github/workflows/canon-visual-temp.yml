name: Temporary canon character browser QA
on:
  push:
    branches: [feat/canon-character-biographies-and-kinship-20261118]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser test setup
        run: npm install --no-save --no-package-lock playwright-core@1.57.0
      - name: Validate 25 cards, dead NPC badges, relationships and Atlas
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/som-canon-site.log 2>&1 &
          sleep 1
          node <<'JS'
          const { chromium } = require("playwright-core");
          const assert=require("node:assert/strict");
          (async()=>{
            const browser=await chromium.launch({executablePath:"/usr/bin/google-chrome",args:["--no-sandbox","--disable-dev-shm-usage"]});
            const context=await browser.newContext({viewport:{width:360,height:780},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            page.setDefaultTimeout(12000);
            const errs=[],badPortraits=[];
            page.on("pageerror",e=>errs.push(e.message));
            page.on("response",r=>{
              if(r.url().includes("/assets/portraits/") && r.status()>=400)
                badPortraits.push(r.url()+": "+r.status());
            });
            await page.goto("http://127.0.0.1:8765/",{waitUntil:"load"});
            assert.equal(await page.locator(".person-card").count(),25);
            assert.equal(await page.locator(".person-card.is-deceased").count(),3);
            assert.equal(await page.locator("#connections .graph-link").count(),17);
            assert.equal(await page.locator("#links-count").innerText(),"17");
            assert.ok(await page.locator(".person-card[data-id='sigurd']").count());
            const routingLoaded=await page.evaluate(()=>typeof window.SOM_GRAPH_GEOMETRY?.link==="function");
            assert.ok(routingLoaded);
            console.log("PASS 25 people, 17 visible links and 3 desaturated deceased cards");
            const first=await page.locator("#map-viewport").screenshot({type:"jpeg",quality:53});
            const b64=first.toString("base64");
            for(let i=0;i<b64.length;i+=3000)
              console.log("QA_CANON_MAP_PART_"+String(i/3000).padStart(3,"0")+"="+b64.slice(i,i+3000));
            await page.locator('[data-character-primary="deceased"]').click();
            assert.equal(await page.locator(".person-card:visible").count(),3);
            for(const id of ["floki","mord","sigurd"]){
              assert.equal(await page.locator('.person-card[data-id="'+id+'"] .person-role-badge').innerText(),"† ZMARŁY");
            }
            await page.locator(".person-card[data-id='mord']").evaluate(el=>el.click());
            assert.ok(await page.locator("#inspector").isVisible());
            assert.ok((await page.locator("#inspector-name").innerText()).includes("Mord"));
            assert.ok((await page.locator("#inspector-type").innerText()).includes("ZMARŁY"));
            assert.ok(await page.locator("#inspector-relations .relation-link").filter({hasText:"Ulf"}).count());
            assert.ok(await page.locator("#inspector-relations .relation-link").filter({hasText:"Svala"}).count());
            console.log("PASS deceased filter and Mord family relation links");
            const screenshot=(await page.screenshot({type:"jpeg",quality:59})).toString("base64");
            for(let i=0;i<screenshot.length;i+=3000)
              console.log("QA_CANON_MORD_PART_"+String(i/3000).padStart(3,"0")+"="+screenshot.slice(i,i+3000));
            await page.locator("#inspector-relations .relation-link").filter({hasText:"Ulf"}).click();
            assert.ok((await page.locator("#inspector-name").innerText()).includes("Ulf"));
            await page.evaluate(()=>history.back());
            await page.waitForFunction(()=>history.state?.somNavigation?.route?.person==="mord");
            assert.ok((await page.locator("#inspector-name").innerText()).includes("Mord"));
            await page.locator("#close-inspector").click();
            await page.waitForFunction(()=>history.state?.somNavigation?.route?.person===null);
            console.log("PASS Mord -> Ulf -> system Back -> Mord, X closes");
            await page.locator('[data-character-primary="all"]').click();
            await page.locator('[data-character-dimension="families"]').click();
            await page.locator("#character-group-options button").filter({hasText:"Rodzina Svali i Ketila"}).click();
            assert.equal(await page.locator(".person-card:visible").count(),3);
            await page.locator("#character-group-options button").filter({hasText:"Rodzina Sigurda i Hroalda"}).click();
            assert.equal(await page.locator(".person-card:visible").count(),6);
            console.log("PASS family filters: Svala (3) and Sigurd-Hroald (6)");
            await page.evaluate(()=>window.SOM_ATLAS.open("hrafnvik"));
            assert.ok(await page.locator("#place-dialog").isVisible());
            assert.ok((await page.locator("#atlas2-dialog-people-toggle").innerText()).includes("23"));
            await page.locator("#atlas2-dialog-people-toggle").click();
            assert.equal(await page.locator("#atlas2-dialog-people .atlas2-npc-card").count(),23);
            assert.ok(await page.locator("#atlas2-dialog-people .atlas2-npc-card").filter({hasText:"Hakon"}).count());
            assert.ok(await page.locator("#atlas2-dialog-people .atlas2-npc-card.is-deceased").count()>=3);
            console.log("PASS Hrafnvik Atlas: 23 people including Hakon and deceased NPC");
            assert.deepEqual(errs,[],"Browser JavaScript errors");
            assert.deepEqual(badPortraits,[],"Broken public portrait downloads");
            console.log("PASS browser: no console JS errors or portrait 404");
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
